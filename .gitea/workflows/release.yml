name: Release (npm publish)

# Publishes the root package to npm when a `vX.Y.Z` tag is pushed.
# Replaces the old GitHub-Release-triggered workflow (GitHub Actions is
# retired). Requires the NPM_TOKEN repo secret.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm (9.14.2 per package.json)
        run: corepack enable && corepack prepare pnpm@9.14.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing v$PKG_VERSION"

      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm exec vitest run tests/unit

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
