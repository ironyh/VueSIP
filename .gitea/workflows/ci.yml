name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (9.14.2 per package.json)
        run: corepack enable && corepack prepare pnpm@9.14.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Stable subset: these directories are verified to run AND exit cleanly.
      - name: Unit tests (lib + unit)
        run: node node_modules/vitest/vitest.mjs run --testTimeout=30000 --hookTimeout=30000 src/composables src/utils src/core tests/unit tests/pbx-framework

      # Remaining unit coverage. Run as a SEPARATE process: combining all suites
      # into one vitest invocation (~441 files) intermittently hangs the process
      # after all tests pass (leaked handles under full parallelism); each of
      # these groups - and the two groups combined - exit cleanly.
      #
      # Build first: bundle-size.test.ts asserts build artifacts exist when
      # CI=true (deliberate — it verifies dist/ size budgets).
      - name: Build library
        run: pnpm build

      - name: Unit tests (integration + performance + composables)
        run: node node_modules/vitest/vitest.mjs run --testTimeout=30000 --hookTimeout=30000 tests/composables tests/integration tests/performance
